name: CI

on:
  push:
    branches:
      - main
      - feature/product-store-checkout
      - feature/imagekit-media-storage
      - setup/firebase-imagekit-mua-and-beauty
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Frontend, unit, security rules, integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Check frontend modules
        run: npm run check:frontend

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Firestore and Storage security tests
        run: npm run test:rules

      - name: Run backend integration tests
        run: npm run test:integration
